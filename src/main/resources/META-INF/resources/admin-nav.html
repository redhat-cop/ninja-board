	<!--
	GOT THE GOOGLE LOGIN CODE FROM HERE:
	https://developers.google.com/identity/sign-in/web/sign-in
	-->
	<div id="signin">
		<script nonce="$NONCE">
			var user,email;
			$(document).ready(function() {
					// use access_token, if exists and is valid then display logout, else display login
					var accessToken=Cookie.get("rh_services_portfolio_access_token");
					// accessToken should always be valid and present since this page needs auth to get to
					if (""!=accessToken){
						Http.httpGetObject("/auth/userInfo?token="+accessToken, function(status,data){
							if (status==200){
								$("#avatar").html("<img referrerpolicy='no-referrer' title='"+data["email"]+"' src='"+data["picture"]+"' style='border: 1px solid black; /*height: 58px;border-radius: 28px;*/'/>");
								$("#avatar").show();
								email=data["email"];
				//				$("#btnSignIn").hide();
								//$("#btnSignOut").show();
							}else{
								showLogin();
							}
						});
					}else{
						showLogin();
					}
			});
		</script>
	</div>
	
	<div id="google_signin">
		<div id="sign-in-wrapper" style="display: inline-flex" class="grid-vertical-center">
			<div id="avatar"></div>
			<div id="btnSignIn" class="g-signin2 signin" style="display: none;" data-onsuccess="onSignInSuccess" data-onfailure="onSignInFailure"></div>
			<div id="avatar" style="display:inline-block;"></div>
			<div id="btnSignOut" style="display: none;"><a href="#" style="color:white;font-size: 10pt;" onclick="signOut();">Sign out</a></div>
			<style nonce="$NONCE">
			#avatar img{width:50px; height: 50px; border-radius:50%; margin-right: 10px; /*width:50px !important; height:50% !important;*/}
			#btnSignOut{display:inline-block;}
			.signin{padding:11px;}
			.grid-vertical-center{display: flex;align-items: center;}
			</style>
		</div>
	</div> <!-- / google_signin -->
