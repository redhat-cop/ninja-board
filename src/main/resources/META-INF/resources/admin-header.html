	<!-- ALERT MESSAGE -->
	<style>
		#main,#wrapper{padding:10px;}
		.header{background-color: black;margin: 0}
		.alert{
		    padding: 15px;
		    margin-bottom: 20px;
		    border: 1px solid transparent;
		    border-radius: 4px;
		    position: fixed; z-index: 999; width: 100%;
		}
		#topbar{height:45px;}
		.header.left{margin:0px;}
	</style>
	<div class="alert alert-success" id="feedback-alert" style="display:none">
    <button type="button" class="close" data-dismiss="alert">x</button>
    <span id="feedback-alert-text">&nbsp;</span>
	</div>
	<script>
	function showMessage(msg, status){
		if (status==undefined) status=200;
		var timeVisible=3000;
		$("#feedback-alert-text").text(msg);
		$("#feedback-alert").removeClass();
		$("#feedback-alert").addClass("alert "+((status>=200 && status<300)?"alert-success":"alert-danger"));
		$("#feedback-alert").show();
		$("#feedback-alert").fadeTo(timeVisible, 500).slideUp(500, function(){
		  $("#feedback-alert").slideUp(500);
		});
	}
	</script>
