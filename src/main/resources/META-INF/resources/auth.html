<html>
<head>
  <!--HEADER_TEMPLATE-->
</head>
<body>
	<div id="topbar"><!--NAV_TEMPLATE--></div>
	<script>$(".header.section.page").html(`User Management`);</script>
	<div id="main">
		<div id="inner">
			<div id="content">
				
				<ul>
					<!-- links to user caches	-->
					<li><a href="/auth/all-user-roles">All users</a>&nbsp;(<a target="_all-roles" href="/auth/cache/all-user-roles">view only</a>)<i class="fa-solid fa-xs fa-up-right-from-square"></i></li>
					<li><a href="/auth/active-users">Active users</a>&nbsp;(<a target="_logins" href="/auth/cache/active-users">view only</a>)<i class="fa-solid fa-xs fa-up-right-from-square"></i></li>
					<!--
					<li></li>
					<li><a href="#" onclick="return clearAuthCache();">Clear active logins (forces all users to re-authenticate)</a></li>
					-->
					<div>
						<table class="newuser">
							<tr>
								<td style="width:18%;">User(s)
	                <xbr/><font color=#AAA><small>(Kerb name; comma separated)</small></font>
	              </td>
								<td><textarea id="new-users" style="height:28px; width:70%;" placeholder="mallen"></textarea></td>
							</tr>
							<tr>
								<td>Role(s)
	                <xbr/><font color=#AAA><small>(comma separated)</small></font>
	              </td>
								<td><input type="text" id="new-users-roles" placeholder="ACCOUNT" style="height:28px; width:60%;"/>&nbsp;<input type="button" value="Add user(s)" onclick="addNewUsers();"/></td>
							</tr>
							<!--tr>
								<td colspan="2"><input type="button" value="Add user(s)" onclick="addNewUsers();"/></td>
							</tr-->
						</table>
						<span id="buttons">
							<input id="btnClearActive" type="button" onclick="clearAuthCacheForUsers();" value="Expire login(s)"/>
							<input id="btnDeleteUser"  type="button" onclick="deleteUsers();"            value="Delete user(s)"/>
						</span>
						<br/>
						<table id="items">
							<thead>
								<tr>
									<th><input class="selectAll" type="checkbox"/></th>
									<th>Username</th>
									<th>Roles</th>
								</tr>
							</thead>
						</table>
					</div>
				</ul>
				
			</div>
		</div>
	</div>
<script>

$(document).ready(function() {
	displayCurrentUsers();
	addSelectAllHandler(".selectAll", ".item-id")
});

function addNewUsers(){
	var usersSplit=document.getElementById("new-users").value.split(",");
	var roles=Array.from(document.getElementById("new-users-roles").value.split(",")).map(e=>e.toUpperCase());
	var users=[];
	for (key in usersSplit){
		//var u=usersSplit[key].includes("@redhat.com")?usersSplit[key]:usersSplit[key]+"@redhat.com";
		//users.push({"username":u, "roles":roles});
		users.push({"username":usersSplit[key], "roles":roles});
	}
	console.log("addNewUsers:: adding new users -> "+JSON.stringify(users));
	Http.httpPost("/auth/users/add", users, function(response, status){
		document.getElementById("new-users").value="";
		document.getElementById("new-users-roles").value="";
		displayCurrentUsers();
	}, function(error){ alert("Error: response code was "+error); });
}
function deleteUsers(){
	var users=Array
		.from(document.getElementsByClassName("item-id"))
		.filter(e => e.checked)
		.map(e => e.value);
	
	console.log("deleteUsers:: users -> "+users);
	Http.httpPost("/auth/users/delete", users, function(response, status){
		displayCurrentUsers();
	}, function(error){ alert("Error: response code was "+error); });
}
function clearAuthCacheForUsers(){
	var users=Array
		.from(document.getElementsByClassName("item-id"))
		.filter(e => e.checked)
		.map(e => e.value);
	
		console.log("clearAuthCacheForUsers:: clearing auth cache for user(s) -> "+users);
		for (u in users)
			Http.httpGet("/auth/cache/"+u+"/clear", function(response, status){
				// do nothing
				console.log("clearAuthCacheForUsers:: successfully cleared auth cache for user -> "+u);
			}, function(error){ alert("Error: response code was "+error); });
}
function clearAuthCache(){
	console.log("clearUser:: clearing entire cache");
	Http.httpGet("/auth/cache/clear", function(response, status){
		// do nothing
	}, function(error){ alert("Error: response code was "+error); });
	return false;
}
function displayCurrentUsers(){
	Http.httpGetObject("/auth/cache/all-user-roles", function(status, response){
		var users=[];
		for(key in response["cache"]){
			//console.log(key);
			users.push({"username":key, "roles":response["cache"][key]});
		}
		displayUsers(users);
	}, function(error){ alert("Error: response code was "+error); });
}


var table;
function displayUsers(data){
	//console.log(data);
	var elemSelector="#items";
	if (undefined!=table){
		$(elemSelector).DataTable().clear();
		$(elemSelector).DataTable().destroy();
	}
	table=$(elemSelector).DataTable({
		"data": data,
		"scrollCollapse": true,
		"searchHighlight": true,
		"order": [[ 1, "asc" ]],
		"paging": false,
		"lengthMenu": [[10, 25, 50, 100, 200, -1], [10, 25, 50, 100, 200, "All"]], // page entry options
		"pageLength" : 5, // default page entries
		"info" : true,
		"buttons":['copy','csv','excel','pdf'],
		"language":{
			"zeroRecords": "No matching items found",
		},
		initComplete: function(){
			$(".dt-search").append($("#buttons").html());
			$("#buttons").hide();
		},
		"columns": [
			{ "data": "username",	"className": "userColumn" },
			{ "data": "roles",		"className": "rolesColumn" }
		],
		"createdRow": function(row, data, dataIndex){ // add a class to the whole row (tr)
			//$(row).attr("data-report_data_issue", data['account_id']);
			
		},
		"rowCallback": function(row, data){ // add a class to just the td cell for that data
			//if (data["pillar"]) $('td.pillarColumn', row).addClass('pillar_'+Utils.toSafeString(data["pillar"]));
		}
		,"columnDefs":[
			{ "targets": 0, "visible": true, "orderable": true, "render": function (data,type,row){
				// this is a hidden column that houses specific filter values
				return `<input type='checkbox' class='item-id' value='`+row["username"]+`'>`;
			}},
			{ "targets": 1, "visible": true, "orderable": true, "render": function (data,type,row){
				// this is a hidden column that houses specific filter values
				return row["username"];
			}},
			{ "targets": 2, "visible": true, "orderable": true, "render": function (data,type,row){
				//return	`<a href="https://redhat.my.salesforce.com/`+row["account_id"]+`">`+data+`</a>`;
				//return row["account_name"]; // or data
				return row["roles"].map(String).join(','); //array to comma delimited string
			}}
		]
	});
}
</script>
</body>
